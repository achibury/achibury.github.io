<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BA">
  <!-- Monograma del sitio. Colores tomados de la paleta de global.css:
       el fondo es --fondo del modo oscuro (#0f172a) y las letras son
       --acento del modo oscuro (#5eead4). Se usa la version oscura en
       los dos modos a proposito: un cuadrado con contraste propio se
       lee igual sobre una pestana clara que sobre una oscura. -->
  <rect width="64" height="64" rx="13" fill="#0f172a" />
  <text
    x="32"
    y="34"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="29"
    font-weight="700"
    letter-spacing="-1.5"
    fill="#5eead4"
  >BA</text>
</svg>
